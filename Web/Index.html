<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vantage - Crafted for Discovery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="Style.css" />
  </head>
  <body>
    <header class="navbar">
      <a href="#" class="logo">VANTAGE</a>
      <nav>
        <ul class="nav-links">
          <li><a href="#">Home</a></li>
          <li><a href="#">Destinations</a></li>
          <li><a href="#">Blog</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main class="hero-section">
      <div class="hero-overlay"></div>

      <section class="hero-content fade-in">
        <p class="hero-subtitle">Luxury travel editorial</p>
        <h1>
          Crafted for <span class="italic-highlight">Discovery</span>
        </h1>
        <div class="hero-buttons">
          <a href="#" class="btn btn-primary">Start Journey</a>
          <a href="#" class="btn btn-secondary">Watch Film</a>
        </div>
      </section>

      <aside class="destination-cards fade-in-delayed" aria-label="Featured destinations">
        <article class="card">
          <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=900&q=80" alt="Ocean coastline" />
          <div class="card-caption">Bali Shores</div>
        </article>
        <article class="card">
          <img src="https://images.unsplash.com/photo-1488646953014-85cb44e25828?auto=format&fit=crop&w=900&q=80" alt="Mountain road" />
          <div class="card-caption">Alpine Drive</div>
        </article>
        <article class="card">
          <img src="https://images.unsplash.com/photo-1512100356356-de1b84283e18?auto=format&fit=crop&w=900&q=80" alt="Desert camp" />
          <div class="card-caption">Sahara Night</div>
        </article>
      </aside>
    </main>
  </body>
</html>
